<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101820"><title>Flatline Racer</title>
<style>
:root{--ink:#101820;--panel:#182632;--lime:#c7f464;--muted:#9fb0ba}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:#f4f7f8;font:600 14px system-ui,sans-serif;overflow:hidden}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.hud{position:fixed;inset:12px 12px auto;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill{background:#182632ef;border:1px solid #ffffff20;border-radius:12px;padding:9px 13px}.big{font-size:22px;color:var(--lime);font-weight:900}.small{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}.controls{position:fixed;left:0;right:0;bottom:12px;display:flex;align-items:end;justify-content:space-between;padding:0 14px;gap:12px;pointer-events:none}.group{pointer-events:auto;display:flex;align-items:center;gap:6px}.stack{display:flex;flex-direction:column;gap:7px}button{border:1px solid #ffffff2a;background:#182632;color:#f4f7f8;border-radius:10px;padding:12px 10px;font:800 12px system-ui;min-width:38px;touch-action:none}button.active{background:var(--lime);color:#101820;border-color:var(--lime)}button.action{min-width:60px;height:48px}#wheel{width:110px;height:110px;border:9px solid #dce5e8;border-radius:50%;background:#182632aa;position:relative;touch-action:none;box-shadow:0 4px 24px #0005}#wheel:before{content:"";position:absolute;width:10px;height:42px;background:#dce5e8;left:41px;top:0;border-radius:5px}#wheel:after{content:"";position:absolute;width:68px;height:9px;background:#dce5e8;left:12px;top:46px;border-radius:5px}.wheelhub{position:absolute;width:24px;height:24px;background:var(--lime);border:5px solid #182632;border-radius:50%;left:34px;top:34px;z-index:2}#hint{position:fixed;top:78px;left:50%;transform:translateX(-50%);background:#182632cc;padding:7px 12px;border-radius:99px;color:#dce5e8;font-size:11px;white-space:nowrap;pointer-events:none}@media(max-width:520px){.controls{padding:0 7px;bottom:8px}.pill{padding:7px 9px}.big{font-size:18px}#wheel{width:88px;height:88px;border-width:8px}#wheel:before{left:32px;height:32px}#wheel:after{width:56px;left:8px;top:37px}.wheelhub{left:26px;top:26px}button{font-size:10px;padding:10px 7px}button.action{min-width:51px;height:44px}.group{gap:4px}}
</style></head><body><canvas id="game"></canvas>
<div class="hud"><div class="pill"><div class="small">FLATLINE / STREET RUN</div><div class="big">RACER</div></div><div class="pill" style="text-align:right"><div class="small">Speed</div><div class="big"><span id="speed">0</span> <span style="font-size:10px">KM/H</span></div></div><div class="pill" style="text-align:right"><div class="small">Distance</div><div class="big"><span id="distance">0.0</span><span style="font-size:10px"> KM</span></div></div></div>
<div id="hint">HOLD FORWARD TO DRIVE · DRAG THE WHEEL TO STEER</div>
<div class="controls"><div class="group"><div id="wheel"><div class="wheelhub"></div></div></div><div class="stack"><div class="group" id="speeds"><button class="speed active" data-speed="1">1</button><button class="speed" data-speed="2">2</button><button class="speed" data-speed="3">3</button><button class="speed" data-speed="4">4</button><button class="speed" data-speed="8">8</button></div><div class="group"><button class="action" id="forward">▲ GO</button><button class="action" id="brake">■ BRAKE</button><button class="action" id="reverse">▼ BACK</button></div></div></div>
<script>
(function(){
const c=document.getElementById('game'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,steer=0,angle=0,gear=1,speed=0,dist=0,scroll=0,carX=0,go=false,brake=false,back=false,traffic=[],spawn=0;
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();
function road(){return{cx:W/2,top:W<600?W*.31:W*.22,bottom:W<600?W*.88:W*.68}}
function drawCar(px,py,w,h,color,player){x.save();x.translate(px,py);x.fillStyle='#071018';x.fillRect(-w*.53,-h*.43,w*1.06,h*.86);x.fillStyle=color;x.fillRect(-w/2,-h/2,w,h);x.fillStyle=player?'#9ce8ed':'#a6c4d0';x.fillRect(-w*.34,-h*.27,w*.68,h*.24);x.fillStyle='#172b38';x.fillRect(-w*.34,h*.04,w*.68,h*.26);x.fillStyle='#f8e9a1';x.fillRect(-w*.4,-h*.46,w*.2,h*.07);x.fillRect(w*.2,-h*.46,w*.2,h*.07);x.fillStyle='#f15b55';x.fillRect(-w*.4,h*.39,w*.2,h*.07);x.fillRect(w*.2,h*.39,w*.2,h*.07);x.restore()}
function draw(){x.clearRect(0,0,W,H);let r=road();x.fillStyle='#7bbd73';x.fillRect(0,0,W,H);for(let i=0;i<9;i++){let bw=28+(i*17)%45,xx=(i*97+20)%W;x.fillStyle=i%2?'#559b68':'#649f70';x.fillRect(xx,0,bw,H*.18)}x.fillStyle='#d9d2b0';x.fillRect(r.cx-r.bottom/2-13,0,r.bottom+26,H);x.fillStyle='#3f484e';x.beginPath();x.moveTo(r.cx-r.top/2,0);x.lineTo(r.cx+r.top/2,0);x.lineTo(r.cx+r.bottom/2,H);x.lineTo(r.cx-r.bottom/2,H);x.closePath();x.fill();x.strokeStyle='#f4e7bd';x.lineWidth=4;x.beginPath();x.moveTo(r.cx-r.top/2,0);x.lineTo(r.cx-r.bottom/2,H);x.moveTo(r.cx+r.top/2,0);x.lineTo(r.cx+r.bottom/2,H);x.stroke();let lane=r.bottom/3;for(let n=1;n<=2;n++)for(let y=-70+(scroll%100);y<H;y+=100){let t=y/H,half=r.top/2+(r.bottom-r.top)*t/2,xx=r.cx+(n-1.5)*2*half/3;x.strokeStyle='#d8d8c7';x.lineWidth=3;x.beginPath();x.moveTo(xx,y);x.lineTo(xx,y+42*(.3+t));x.stroke()}for(let y=-40+(scroll%90);y<H;y+=90)for(let s of [-1,1]){x.fillStyle='#f4e7bd';x.fillRect(r.cx+s*(r.bottom/2+7),y,7,24)}traffic.forEach(t=>drawCar(r.cx+t.x*lane,H*t.y,Math.max(24,lane*.43),Math.max(42,lane*.78),t.color,false));drawCar(r.cx+carX*lane,H*.75,Math.max(30,lane*.48),Math.max(52,lane*.88),'#c7f464',true)}
function tick(){let target=back?-gear*13:brake?0:go?gear*17:0;speed+=(target-speed)*.045;scroll+=Math.abs(speed)*.12;dist+=Math.max(0,speed)*.000008;spawn+=Math.abs(speed)*.001;if(spawn>2.2){spawn=0;traffic.push({x:Math.floor(Math.random()*3)-1,y:-.2,color:['#ff715b','#4aa9d8','#f3c969','#b28be0'][Math.floor(Math.random()*4)]})}traffic.forEach(t=>t.y+=.004+Math.abs(speed)*.00012);traffic=traffic.filter(t=>t.y<1.2);traffic.forEach(t=>{if(Math.abs(t.x-carX)<.42&&Math.abs(t.y-.75)<.10)speed*=.94});carX=Math.max(-1,Math.min(1,carX+steer*.012));draw();$('speed').textContent=Math.round(Math.abs(speed)*3.2);$('distance').textContent=dist.toFixed(1);requestAnimationFrame(tick)}tick();
function gearSet(v){gear=v;document.querySelectorAll('.speed').forEach(b=>b.classList.toggle('active',+b.dataset.speed===v))}document.querySelectorAll('.speed').forEach(b=>b.addEventListener('click',()=>gearSet(+b.dataset.speed)));
function hold(id,fn){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();fn(true)});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>fn(false)))}hold('forward',v=>go=v);hold('brake',v=>brake=v);hold('reverse',v=>back=v);
let wheel=$('wheel'),drag=false,last=0;wheel.addEventListener('pointerdown',e=>{drag=true;last=e.clientX;wheel.setPointerCapture(e.pointerId)});wheel.addEventListener('pointermove',e=>{if(!drag)return;angle=Math.max(-100,Math.min(100,angle+(e.clientX-last)*1.4));last=e.clientX;steer=Math.max(-1,Math.min(1,angle/100));wheel.style.transform='rotate('+angle+'deg)'});function end(){drag=false;steer=0;angle*=.65;wheel.style.transform='rotate('+angle+'deg)'}wheel.addEventListener('pointerup',end);wheel.addEventListener('pointercancel',end);
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault();if('12348'.includes(e.key))gearSet(+e.key)});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);function keyboard(){if(keys.arrowleft||keys.a){steer=-1;angle=-65;wheel.style.transform='rotate(-65deg)'}else if(keys.arrowright||keys.d){steer=1;angle=65;wheel.style.transform='rotate(65deg)'}else if(!drag){steer=0;angle*=.8;wheel.style.transform='rotate('+angle+'deg)'}brake=!!(keys[' ']||keys.q);back=!!(keys.arrowdown||keys.s);go=!!(keys.arrowup||keys.w);if(go)back=false;requestAnimationFrame(keyboard)}keyboard();
})();
</script></body></html>
